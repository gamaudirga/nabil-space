<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Na Lemba Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Efek font tulisan tangan agar estetik ala rolling paper */
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;600&display=swap');
        .handwritten { font-family: 'Caveat', cursive; }
        .poppins { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body style="background-image: url('bg.jpg'); background-size: contain; background-repeat: repeat; background-attachment: fixed;" class="min-h-screen poppins p-6 flex flex-col items-center">

    <header class="text-center my-6 bg-white/80 backdrop-blur-sm px-6 py-4 rounded-2xl shadow-sm border border-blue-100">
        <h1 class="text-4xl font-bold text-blue-900">To Na Lemba, With Love 💙</h1>
        <p class="text-blue-700 mt-2 font-medium">Serta Mulia, Na Biantara Lemba Diemans! Yuk, tinggalkan ucapan manis dengan nama atau anonim di bawah ini!</p>
    </header>

    <div class="mb-8">
        <button id="openFormBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-full shadow-lg transition duration-300 transform hover:scale-105">
            ✍️ Tulis Ucapan
        </button>
    </div>

    <div id="formModal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Kirim Pesan Anonim</h2>
            <form id="paperForm">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Pilih Warna Kertas:</label>
                    <div class="flex gap-3">
                        <label class="cursor-pointer"><input type="radio" name="color" value="bg-yellow-100" checked class="hidden peer"><span class="block w-8 h-8 rounded-full bg-yellow-100 border-2 peer-checked:border-blue-600"></span></label>
                        <label class="cursor-pointer"><input type="radio" name="color" value="bg-blue-100" class="hidden peer"><span class="block w-8 h-8 rounded-full bg-blue-100 border-2 peer-checked:border-blue-600"></span></label>
                        <label class="cursor-pointer"><input type="radio" name="color" value="bg-green-100" class="hidden peer"><span class="block w-8 h-8 rounded-full bg-green-100 border-2 peer-checked:border-blue-600"></span></label>
                        <label class="cursor-pointer"><input type="radio" name="color" value="bg-pink-100" class="hidden peer"><span class="block w-8 h-8 rounded-full bg-pink-100 border-2 peer-checked:border-blue-600"></span></label>
                        <label class="cursor-pointer"><input type="radio" name="color" value="bg-purple-100" class="hidden peer"><span class="block w-8 h-8 rounded-full bg-purple-100 border-2 peer-checked:border-blue-600"></span></label>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Nama/Alias (Kosongkan jika anonim):</label>
                    <input type="text" id="senderName" placeholder="Contoh: Secret Admirer" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Isi Ucapan:</label>
                    <textarea id="messageText" required rows="4" placeholder="Tulis sesuatu yang manis..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" id="closeFormBtn" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400">Batal</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Kirim ✨</button>
                </div>
            </form>
        </div>
    </div>

    <main id="board" class="w-full max-w-6xl grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-6 bg-white/40 backdrop-blur-[2px] rounded-3xl min-h-[400px]">
        </main>

    <script type="module" src="app.js"></script>
</body>
</html>
